<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | .NET Conf 2026</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #F8F9FA;
        color: #14053A;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .card {
        background: #ffffff;
        border: 1px solid rgba(231, 229, 228, 0.8);
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        max-width: 400px;
        width: 100%;
        padding: 32px 24px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .mascot {
        width: 80px;
        height: 80px;
        margin-bottom: 16px;
        object-contain: contain;
      }
      .badge {
        font-family: monospace;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #512BD4;
        background: #EEEAFB;
        padding: 4px 12px;
        border-radius: 999px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        color: #14053A;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        color: #57534E;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .countdown {
        color: #512BD4;
        font-weight: 600;
      }
      .btn {
        width: 100%;
        padding: 10px 16px;
        background: #512BD4;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      .btn:hover {
        background: #4323B0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/mascot/bot_frontal.png" alt=".NET Bot" class="mascot" />
      <span class="badge">404 Error</span>
      <h1>Page Not Found</h1>
      <p>
        The page you are looking for doesn't exist or has been moved.
      </p>
      <a href="/" class="btn">
        <span>Go to Home</span>
        <span>→</span>
      </a>
    </div>
  </body>
</html>
